name: Check
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-bookworm
        env:
          POSTGRES_USER: remi
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: remi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U remi -d remi_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://remi:local-test-only@localhost:5432/remi_test
      - name: Reject runtime and secret files
        shell: bash
        run: ./scripts/check-repository.sh
      - name: Build production image
        run: docker build --tag remi:ci .
